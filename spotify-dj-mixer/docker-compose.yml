version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5001:5001"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5001
    command: npm run dev

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend
    environment:
      - PORT=3333
      - REACT_APP_API_URL=http://localhost:5001
