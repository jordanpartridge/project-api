services:
  nginx-proxy:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy
    ports:
      - '80:80'
      - '81:81'  # Admin UI
      - '443:443'
    volumes:
      - ./nginx-proxy-data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project-api
    container_name: project-api-app
    restart: unless-stopped
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - APP_URL=http://api.test
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - VIRTUAL_HOST=api.test
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
    networks:
      - app-network
    depends_on:
      - db
      - redis

  bike-service:
    build:
      context: ./services/bike-service
      dockerfile: Dockerfile
    container_name: bike-service
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=bikes
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - VIRTUAL_HOST=bikes.test
    volumes:
      - ./services/bike-service:/var/www
    networks:
      - app-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: project-api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: project-api-redis
    restart: unless-stopped
    networks:
      - app-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    command: bash start.sh
    environment:
      - VIRTUAL_HOST=claude.test
    networks:
      - app-network

  ollama-webui:
    image: ghcr.io/ollama-webui/ollama-webui:main
    container_name: ollama-webui
    restart: unless-stopped
    command: bash start.sh
    environment:
      - VIRTUAL_HOST=ollama.test
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dbdata:
    driver: local