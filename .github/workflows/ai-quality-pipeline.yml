name: AI Quality Pipeline

on:
  push:
    paths:
      - 'app/Services/AI/**'
      - 'tests/Unit/Services/AI/**'
      - 'config/ai.php'
  pull_request:
    paths:
      - 'app/Services/AI/**'
      - 'tests/Unit/Services/AI/**'
      - 'config/ai.php'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: xdebug
          
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Copy .env
        run: cp .env.example .env
        
      - name: Generate key
        run: php artisan key:generate
        
      - name: Run Tests
        run: php artisan test --filter=AI
        
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse app/Services/AI tests/Unit/Services/AI
        
  quality-metrics:
    name: Quality Metrics
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
        
      - name: Run PHPMD
        run: ./vendor/bin/phpmd app/Services/AI text cleancode,codesize,controversial,design,naming,unusedcode